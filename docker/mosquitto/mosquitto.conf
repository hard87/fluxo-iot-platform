# Fluxo Mosquitto local profile
# - 1883: desenvolvimento interno sem TLS (risco documentado)
# - 8883: TLS para validacao de fluxo seguro local
# Autenticacao e ACL por device sao geridas pelo plugin dynamic-security
# (ver docs/mqtt-tls-e-credenciais.md). Nao ha mais password_file/acl_file estaticos.

allow_anonymous false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

listener 1883 0.0.0.0
protocol mqtt

listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2
