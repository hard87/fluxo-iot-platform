[Unit]
# Espera limitada por sincronizacao NTP antes de publicar telemetria com timestamp
# potencialmente errado (Pi sem RTC: relogio comeca desalinhado em todo boot frio ate
# o systemd-timesyncd corrigir). Nao usa After=/Wants=time-set.target puro porque isso
# bloquearia o gateway indefinidamente se nao houver rede no boot -- preferimos degradar
# (seguir mesmo sem sync, apos o timeout) a deixar o gateway inteiro fora do ar.
#
# Segunda camada de defesa (nao substitui esta): gateway-spool.js's enqueue() tambem
# verifica NTPSynchronized a cada publicacao e descarta a medicao se o relogio estiver
# explicitamente nao sincronizado -- ver docs/troubleshooting.md.
#
# Instalar em: /etc/systemd/system/nodered.service.d/ntp-gate.conf (mkdir -p o diretorio
# .d se nao existir), depois `systemctl daemon-reload`.

[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ "$(timedatectl show -p NTPSynchronized --value)" != "yes" ] && [ $i -lt 120 ]; do sleep 2; i=$((i+2)); done; if [ "$(timedatectl show -p NTPSynchronized --value)" != "yes" ]; then echo "AVISO: subindo sem confirmacao de sync NTP apos 120s de espera" | systemd-cat -t fluxo-ntp-gate -p warning; fi; exit 0'
