name: CI

on:
  push:
    branches:
      - main
      - chore-piloto-local-docker-hardening
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal-web/package-lock.json

      - name: Restore
        run: dotnet restore Fluxo.slnx

      - name: Build
        run: dotnet build Fluxo.slnx --no-restore

      - name: Test
        run: dotnet test Fluxo.slnx --no-build --verbosity normal

      - name: Install frontend dependencies
        working-directory: portal-web
        run: npm ci

      - name: Build frontend
        working-directory: portal-web
        run: npm run build
